name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build app
        run: ./build.sh

      - name: Package zip
        run: |
          cd dist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Kinopub.app/Contents/Info.plist)
          ditto -c -k --norsrc --noextattr --keepParent Kinopub.app "Kinopub-${VERSION}.zip"
          echo "ZIP=dist/Kinopub-${VERSION}.zip" >> "$GITHUB_ENV"
          ls -l "Kinopub-${VERSION}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kinopub-app
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 90

      # На тег v* дополнительно создаём/обновляем GitHub Release
      # и прикрепляем к нему собранный zip.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          fail_on_unmatched_files: true
